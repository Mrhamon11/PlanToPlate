<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Profile — PlanToPlate</title>
</head>
<body>
    <main>
        <h1>{{ user.username }}</h1>
        <p>Member since {{ user.date_joined|date:"F j, Y" }}</p>

        <p><a href="{% url 'accounts:password_change' %}">Change password</a></p>

        <form method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button type="submit">Log out</button>
        </form>
    </main>
</body>
</html>
